# CI（T05、Issue #17）。内容と結果の読み方は docs/development.md の「CI」。
# - 標準のGitHub-hosted runnerだけを使う。権限はcontents: readだけで、secretsを使わず、artifactをuploadしない。
# - actionはcommitのSHAで固定する（行末のコメントは版）。
# - pull_request（pull_request_targetではない）で、PRのコードを書込みの権限なしで動かす。
#   workflow自体もPRで変えられるので、CIの合格は独立レビューの代わりにならず、迂回を防ぐ強制ゲートでもない
#   （docs/review-prevention.md）。workflowの変更は、別の担当が内容をレビューする。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js (devEngines.runtime in package.json)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false
      - name: Show the runtime
        run: |
          node --version
          npm --version
          node -p "process.platform + '/' + process.arch + (process.getuid ? ' uid=' + process.getuid() : '')"
      - name: npm run setup
        id: setup
        run: npm run setup
      - name: npm run check:install
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:install
      - name: npm run typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck
      - name: npm test
        id: test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm test | tee "$RUNNER_TEMP/npm-test.txt"
      - name: Compare the skipped tests with docs/development.md
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: npm run check:test-skips -- "$RUNNER_TEMP/npm-test.txt"
      - name: npm run build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run build
      - name: npm run check:public
        if: ${{ !cancelled() }}
        run: npm run check:public

  # Windowsの一般のユーザー（管理者でない）での試験（Issue #19）。GitHubのWindowsのrunnerは管理者で動くので、
  # 一時のローカルユーザー（Usersだけに属する）を作り、タスク スケジューラ（権限は制限）でnpm testと同じ試験を
  # そのユーザーとして実行し、skipを照合する。パスワードはこのジョブの中で乱数から作り、表示もファイルへの保存も
  # しない（タスクの登録に渡すだけ）。runnerは使い捨てのVMで、最後にタスクとユーザーを消す。
  # docs/development.md の「CI」と「Windowsのコンソールの中断の試験」。
  windows-standard-user:
    name: checks (windows, standard user)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      KL_STD_USER: klstandarduser
      KL_STD_TASK: kurashi-ledger-standard-user-tests
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js (devEngines.runtime in package.json)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false
      - name: npm run setup
        id: setup
        run: npm run setup
      - name: Run the tests of npm test as a temporary standard user
        id: test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # Windows PowerShell 5.1（Windowsに同梱。ローカルユーザーの操作のモジュールがそのまま動く）。5.1はスクリプトの
        # 文字コードを決め打ちできないので、表示する文字列は英語にする。
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'kl-standard-user'
          New-Item -ItemType Directory -Path $dir | Out-Null
          # npm testと同じ対象（package.jsonのtestのscript）を、npmを通さずにnode --testで実行する。
          $script = (Get-Content -Raw package.json | ConvertFrom-Json).scripts.test
          if ($script -notmatch '^node --test ("[^"]+" ?)+$') { throw "cannot read the test script of package.json: $script" }
          $node = (Get-Command node).Source
          # 実行するユーザーが書くのは、出力のディレクトリと自分のプロファイル（一時ファイル）だけ。
          [System.IO.File]::WriteAllText((Join-Path $dir 'run.mjs'), @'
          import { spawnSync } from 'node:child_process';
          import { closeSync, openSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const [dir, ...args] = process.argv.slice(2);
          const groups = spawnSync('whoami', ['/groups', '/fo', 'csv', '/nh'], { encoding: 'utf8' });
          const out = openSync(join(dir, 'npm-test.txt'), 'w');
          const run = spawnSync(process.execPath, args, { stdio: ['ignore', out, out] });
          closeSync(out);
          writeFileSync(join(dir, 'result.json'), JSON.stringify({ status: run.status, signal: run.signal, error: run.error?.message ?? null, groups: groups.stdout ?? '', tmpdir: tmpdir() }));
          '@)
          # 乱数のパスワード。表示もファイルへの保存もせず、このステップの中でだけ使う（タスクの登録に渡す）。
          $bytes = New-Object byte[] 48
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)
          $rng.Dispose()
          $plain = [Convert]::ToBase64String($bytes) + 'aA1!'
          [Array]::Clear($bytes, 0, $bytes.Length)
          New-LocalUser -Name $env:KL_STD_USER -Password (ConvertTo-SecureString $plain -AsPlainText -Force) -PasswordNeverExpires -AccountNeverExpires -Description 'Temporary standard user for CI' | Out-Null
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $env:KL_STD_USER
          icacls $dir /grant "$($env:KL_STD_USER):(OI)(CI)M" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'icacls failed' }
          $arguments = '"' + (Join-Path $dir 'run.mjs') + '" "' + $dir + '" ' + $script.Substring('node '.Length)
          $action = New-ScheduledTaskAction -Execute $node -Argument $arguments -WorkingDirectory $env:GITHUB_WORKSPACE
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 25) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
          # パスワードでログオンするタスク（ログオンしていなくても動く）。権限は制限（RunLevel Limited）。
          Register-ScheduledTask -TaskName $env:KL_STD_TASK -Action $action -Settings $settings -User "$env:COMPUTERNAME\$env:KL_STD_USER" -Password $plain -RunLevel Limited | Out-Null
          Remove-Variable plain
          Start-ScheduledTask -TaskName $env:KL_STD_TASK
          $result = Join-Path $dir 'result.json'
          $deadline = (Get-Date).AddMinutes(25)
          while (-not (Test-Path $result)) {
            if ((Get-Date) -gt $deadline) { throw 'the tests as the standard user did not finish in time' }
            Start-Sleep -Seconds 5
            $info = Get-ScheduledTaskInfo -TaskName $env:KL_STD_TASK
            $state = (Get-ScheduledTask -TaskName $env:KL_STD_TASK).State
            # 267009: 実行中、267011: まだ実行していない。それ以外でReadyなら、タスクは終わっている。
            if ($state -eq 'Ready' -and $info.LastTaskResult -ne 267011 -and $info.LastTaskResult -ne 267009 -and -not (Test-Path $result)) {
              Start-Sleep -Seconds 2
              if (-not (Test-Path $result)) { throw "the task ended without writing the result (LastTaskResult: $($info.LastTaskResult))" }
            }
          }
          Start-Sleep -Seconds 1
          Get-Content (Join-Path $dir 'npm-test.txt')
          $r = Get-Content -Raw $result | ConvertFrom-Json
          # 管理者でないこと: 整合性レベルがMedium（S-1-16-8192）で、High以上がなく、Administrators（S-1-5-32-544）を含まない。
          $standard = ($r.groups -match 'S-1-16-8192') -and ($r.groups -notmatch 'S-1-16-12288|S-1-16-16384') -and ($r.groups -notmatch 'S-1-5-32-544')
          $summary = @(
            '### Tests as a temporary Windows standard user'
            ''
            "- Not an administrator (Medium integrity, no Administrators group): $standard"
            "- Exit code of node --test: $($r.status) (signal: $($r.signal), start error: $($r.error))"
            ''
          ) -join "`n"
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary + "`n")
          if (-not $standard) { throw 'the tests did not run as a standard (non-administrator) user' }
          if ($r.status -ne 0) { throw "the tests failed as the standard user (exit code $($r.status))" }
      - name: Compare the skipped tests with docs/development.md
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: npm run check:test-skips -- "$RUNNER_TEMP/kl-standard-user/npm-test.txt"
      - name: Remove the temporary user and task
        if: ${{ always() }}
        shell: powershell
        run: |
          Unregister-ScheduledTask -TaskName $env:KL_STD_TASK -Confirm:$false -ErrorAction SilentlyContinue
          $user = Get-LocalUser -Name $env:KL_STD_USER -ErrorAction SilentlyContinue
          if ($null -ne $user) {
            Remove-LocalUser -Name $env:KL_STD_USER
            Get-CimInstance Win32_UserProfile | Where-Object { $_.SID -eq $user.SID.Value } | Remove-CimInstance -ErrorAction Continue
          }

  browser:
    name: browser (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            install-args: --with-deps
          - name: windows
            os: windows-latest
            install-args: ''
          - name: macos
            os: macos-latest
            install-args: ''
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js (devEngines.runtime in package.json)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false
      - name: npm run setup
        run: npm run setup
      - name: Install the browsers for this OS (e2e/browsers.ts)
        env:
          INSTALL_ARGS: ${{ matrix.install-args }}
        # INSTALL_ARGSは空か--with-depsだけ（上のmatrix）。空のときに引数を渡さないよう、引用符で囲まない。
        run: npm run test:browser:install -- $INSTALL_ARGS
      - name: npm run test:browser
        run: npm run test:browser

  review-tools:
    name: review tools (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11 (the oldest version the tool supports)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate the catalog and the ledger
        run: python -E -s tools/review_guard/guard.py validate
      # unittestは、0件・skip・期待した失敗（expectedFailure）でも0で終わるので、要約の行も照合する
      # （ブラウザ試験のPR18-R002と同じ穴を塞ぐ）。
      - name: Test the generic tool and the repository routing
        run: |
          set -o pipefail
          strict_unittest() {
            local log="$RUNNER_TEMP/unittest-$1.txt"
            if ! python -E -s -m unittest discover -s "$2" -v 2>&1 | tee "$log"; then
              echo "::error::$2 の試験が失敗した"
              return 1
            fi
            if grep -Eq '^Ran 0 tests' "$log"; then
              echo "::error::$2 の試験が0件"
              return 1
            fi
            if grep -Eq '^(OK|FAILED) \(.*(skipped|expected failures|unexpected successes)=' "$log"; then
              echo "::error::$2 に、skip・期待した失敗・予期しない成功のどれかがある（成功として扱わない）"
              return 1
            fi
          }
          strict_unittest tool tools/review_guard/tests
          strict_unittest routing .review/tests

  # tools/review_guard/adapters/github-actions.yml の計画の検査を配置したもの。baseのcheckoutの検査器だけを
  # 実行し、PRのコード（candidate）は実行しない。PRのときだけ動く。
  review-plan:
    name: review plan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Read trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: List actual paths without executing candidate code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f baseline/tools/review_guard/changed_paths.py ]; then
            echo 'bootstrap: base adapter missing; plan enforcement NOT verified.'
            exit 1
          fi
          python -E -s baseline/tools/review_guard/changed_paths.py --repository candidate --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --output changed.json
      - name: Check plan using base policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ ! -f baseline/tools/review_guard/ci.py ]; then
            echo 'bootstrap: base has no review guard; plan enforcement is NOT verified. Independent review is required.'
            exit 1
          fi
          python -E -s baseline/tools/review_guard/ci.py --candidate candidate --paths-file changed.json --base-sha "$BASE_SHA"

  # 最終の判定。どれかのジョブが失敗・中断・skip（欠けた）なら失敗にする。pushのときは計画の検査がないので、
  # その結果がskippedであることを求める。試験したcommitと、PRのhead・baseのSHAをstep summaryに残す。
  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [checks, windows-standard-user, browser, review-tools, review-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every job and record the commits
        env:
          EVENT: ${{ github.event_name }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKS: ${{ needs.checks.result }}
          WINDOWS_STANDARD_USER: ${{ needs.windows-standard-user.result }}
          BROWSER: ${{ needs.browser.result }}
          REVIEW_TOOLS: ${{ needs.review-tools.result }}
          REVIEW_PLAN: ${{ needs.review-plan.result }}
        run: |
          problems=()
          expect() {
            if [ "$2" != "$3" ]; then problems+=("$1 の結果が $2（必要なのは $3）"); fi
          }
          expect checks "$CHECKS" success
          expect windows-standard-user "$WINDOWS_STANDARD_USER" success
          expect browser "$BROWSER" success
          expect review-tools "$REVIEW_TOOLS" success
          if [ "$EVENT" = pull_request ]; then
            expect review-plan "$REVIEW_PLAN" success
          else
            expect review-plan "$REVIEW_PLAN" skipped
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$TESTED_SHA" ]; then problems+=("checkoutしたcommit $actual が github.sha $TESTED_SHA と違う"); fi
          parents=$(git cat-file -p HEAD | sed -n 's/^parent //p' | paste -sd ' ' -)
          if [ "$EVENT" = pull_request ] && [ "$parents" != "$BASE_SHA $HEAD_SHA" ]; then
            problems+=("試験したmerge commitの親（$parents）が、PRのbase $BASE_SHA とhead $HEAD_SHA でない")
          fi
          {
            echo '### Quality gate'
            echo
            echo '| 項目 | 値 |'
            echo '| --- | --- |'
            echo "| イベント | $EVENT |"
            echo "| 試験したcommit | $TESTED_SHA |"
            echo "| その親 | $parents |"
            if [ "$EVENT" = pull_request ]; then
              echo "| PRのhead | $HEAD_SHA |"
              echo "| PRのbase | $BASE_SHA |"
            fi
            echo "| checks（3 OS） | $CHECKS |"
            echo "| checks（Windowsの一般のユーザー） | $WINDOWS_STANDARD_USER |"
            echo "| browser（3 OS） | $BROWSER |"
            echo "| review tools（3 OS） | $REVIEW_TOOLS |"
            echo "| review plan | $REVIEW_PLAN |"
            echo
            if [ ${#problems[@]} -eq 0 ]; then
              echo '判定: 成功。CIの合格は、独立した内容レビューと所有者の判断の代わりにならない。'
            else
              echo '判定: 失敗。'
              printf -- '- %s\n' "${problems[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#problems[@]} -gt 0 ]; then
            printf '::error::%s\n' "${problems[@]}"
            exit 1
          fi
          echo 'すべてのジョブが成功した。'
