# CI（T05、Issue #17）。内容と結果の読み方は docs/development.md の「CI」。
# - 標準のGitHub-hosted runnerだけを使う。権限はcontents: readだけで、secretsを使わず、artifactをuploadしない。
# - actionはcommitのSHAで固定する（行末のコメントは版）。
# - pull_request（pull_request_targetではない）で、PRのコードを書込みの権限なしで動かす。
#   workflow自体もPRで変えられるので、CIの合格は独立レビューの代わりにならず、迂回を防ぐ強制ゲートでもない
#   （docs/review-prevention.md）。workflowの変更は、別の担当が内容をレビューする。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js (devEngines.runtime in package.json)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false
      - name: Show the runtime
        run: |
          node --version
          npm --version
          node -p "process.platform + '/' + process.arch + (process.getuid ? ' uid=' + process.getuid() : '')"
      - name: npm run setup
        id: setup
        run: npm run setup
      - name: npm run check:install
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run check:install
      - name: npm run typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run typecheck
      - name: npm test
        id: test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm test | tee "$RUNNER_TEMP/npm-test.txt"
      - name: Compare the skipped tests with docs/development.md
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: npm run check:test-skips -- "$RUNNER_TEMP/npm-test.txt"
      - name: npm run build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run build
      - name: npm run check:public
        if: ${{ !cancelled() }}
        run: npm run check:public

  # Windowsの一般のユーザー（管理者でない）での試験（Issue #19）。GitHubのWindowsのrunnerは管理者で動くので、
  # 一時のローカルユーザー（Usersだけに属する）を作り、そのユーザーとしてログオンして（Start-Process -Credential）
  # npm testと同じ試験を実行し、skipを照合する。作成・実行・後始末は .github/scripts/windows-standard-user.ps1。
  # パスワードはこのジョブの中で乱数から作り、表示もファイルへの保存もしない。runnerは使い捨てのVMで、最後に
  # そのユーザーのプロセスを止めてから、ユーザーとプロファイルを消す。
  # docs/development.md の「CI」と「Windowsのコンソールの中断の試験」。
  windows-standard-user:
    name: checks (windows, standard user)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      KL_STD_USER: klstandarduser
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js (devEngines.runtime in package.json)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false
      - name: npm run setup
        id: setup
        run: npm run setup
      # 時間切れの後始末の自己試験: 子と孫を残して止まらない処理を短い時間切れで実行し、時間切れになることと、
      # 後始末のあとにそのユーザーのプロセス・ユーザー・プロファイルが残らないことを確かめる（PR33-R002）。
      - name: Self-test the timeout cleanup of the standard user
        id: selftest
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = [scriptblock]::Create([System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github\scripts\windows-standard-user.ps1'), [System.Text.Encoding]::UTF8))
          $dir = Join-Path $env:RUNNER_TEMP 'kl-standard-user-selftest'
          try {
            & $helper -Action Run -UserName $env:KL_STD_USER -OutputDir $dir -Mode hang -TimeoutSeconds 20
            if (-not (Test-Path (Join-Path $dir 'timed-out'))) { throw 'the hanging self-test did not time out' }
          } finally {
            & $helper -Action Cleanup -UserName $env:KL_STD_USER
          }
      - name: Run the tests of npm test as a temporary standard user
        id: test
        if: ${{ !cancelled() && steps.selftest.outcome == 'success' }}
        # Windows PowerShell 5.1（Windowsに同梱。ローカルユーザーの操作のモジュールがそのまま動く）。
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = [scriptblock]::Create([System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github\scripts\windows-standard-user.ps1'), [System.Text.Encoding]::UTF8))
          $dir = Join-Path $env:RUNNER_TEMP 'kl-standard-user'
          & $helper -Action Run -UserName $env:KL_STD_USER -OutputDir $dir -Mode tests -TimeoutSeconds 900
          if (Test-Path (Join-Path $dir 'timed-out')) { throw 'the tests as the standard user did not finish in time' }
      - name: Compare the skipped tests with docs/development.md
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: npm run check:test-skips -- "$RUNNER_TEMP/kl-standard-user/npm-test.txt"
      # 成否にかかわらず、そのユーザーのすべてのプロセスを止めてからユーザーとプロファイルを消し、残れば失敗にする。
      - name: Remove the temporary user, its processes and its profile
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = [scriptblock]::Create([System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE '.github\scripts\windows-standard-user.ps1'), [System.Text.Encoding]::UTF8))
          & $helper -Action Cleanup -UserName $env:KL_STD_USER

  browser:
    name: browser (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            install-args: --with-deps
          - name: windows
            os: windows-latest
            install-args: ''
          - name: macos
            os: macos-latest
            install-args: ''
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js (devEngines.runtime in package.json)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          check-latest: true
          package-manager-cache: false
      - name: npm run setup
        run: npm run setup
      - name: Install the browsers for this OS (e2e/browsers.ts)
        env:
          INSTALL_ARGS: ${{ matrix.install-args }}
        # INSTALL_ARGSは空か--with-depsだけ（上のmatrix）。空のときに引数を渡さないよう、引用符で囲まない。
        run: npm run test:browser:install -- $INSTALL_ARGS
      - name: npm run test:browser
        run: npm run test:browser

  review-tools:
    name: review tools (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11 (the oldest version the tool supports)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate the catalog and the ledger
        run: python -E -s tools/review_guard/guard.py validate
      # unittestは、0件・skip・期待した失敗（expectedFailure）でも0で終わるので、要約の行も照合する
      # （ブラウザ試験のPR18-R002と同じ穴を塞ぐ）。
      - name: Test the generic tool and the repository routing
        run: |
          set -o pipefail
          strict_unittest() {
            local log="$RUNNER_TEMP/unittest-$1.txt"
            if ! python -E -s -m unittest discover -s "$2" -v 2>&1 | tee "$log"; then
              echo "::error::$2 の試験が失敗した"
              return 1
            fi
            if grep -Eq '^Ran 0 tests' "$log"; then
              echo "::error::$2 の試験が0件"
              return 1
            fi
            if grep -Eq '^(OK|FAILED) \(.*(skipped|expected failures|unexpected successes)=' "$log"; then
              echo "::error::$2 に、skip・期待した失敗・予期しない成功のどれかがある（成功として扱わない）"
              return 1
            fi
          }
          strict_unittest tool tools/review_guard/tests
          strict_unittest routing .review/tests

  # tools/review_guard/adapters/github-actions.yml の計画の検査を配置したもの。baseのcheckoutの検査器だけを
  # 実行し、PRのコード（candidate）は実行しない。PRのときだけ動く。
  review-plan:
    name: review plan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Read trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: List actual paths without executing candidate code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f baseline/tools/review_guard/changed_paths.py ]; then
            echo 'bootstrap: base adapter missing; plan enforcement NOT verified.'
            exit 1
          fi
          python -E -s baseline/tools/review_guard/changed_paths.py --repository candidate --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --output changed.json
      - name: Check plan using base policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ ! -f baseline/tools/review_guard/ci.py ]; then
            echo 'bootstrap: base has no review guard; plan enforcement is NOT verified. Independent review is required.'
            exit 1
          fi
          python -E -s baseline/tools/review_guard/ci.py --candidate candidate --paths-file changed.json --base-sha "$BASE_SHA"

  # 最終の判定。どれかのジョブが失敗・中断・skip（欠けた）なら失敗にする。pushのときは計画の検査がないので、
  # その結果がskippedであることを求める。試験したcommitと、PRのhead・baseのSHAをstep summaryに残す。
  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [checks, windows-standard-user, browser, review-tools, review-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every job and record the commits
        env:
          EVENT: ${{ github.event_name }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKS: ${{ needs.checks.result }}
          WINDOWS_STANDARD_USER: ${{ needs.windows-standard-user.result }}
          BROWSER: ${{ needs.browser.result }}
          REVIEW_TOOLS: ${{ needs.review-tools.result }}
          REVIEW_PLAN: ${{ needs.review-plan.result }}
        run: |
          problems=()
          expect() {
            if [ "$2" != "$3" ]; then problems+=("$1 の結果が $2（必要なのは $3）"); fi
          }
          expect checks "$CHECKS" success
          expect windows-standard-user "$WINDOWS_STANDARD_USER" success
          expect browser "$BROWSER" success
          expect review-tools "$REVIEW_TOOLS" success
          if [ "$EVENT" = pull_request ]; then
            expect review-plan "$REVIEW_PLAN" success
          else
            expect review-plan "$REVIEW_PLAN" skipped
          fi
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$TESTED_SHA" ]; then problems+=("checkoutしたcommit $actual が github.sha $TESTED_SHA と違う"); fi
          parents=$(git cat-file -p HEAD | sed -n 's/^parent //p' | paste -sd ' ' -)
          if [ "$EVENT" = pull_request ] && [ "$parents" != "$BASE_SHA $HEAD_SHA" ]; then
            problems+=("試験したmerge commitの親（$parents）が、PRのbase $BASE_SHA とhead $HEAD_SHA でない")
          fi
          {
            echo '### Quality gate'
            echo
            echo '| 項目 | 値 |'
            echo '| --- | --- |'
            echo "| イベント | $EVENT |"
            echo "| 試験したcommit | $TESTED_SHA |"
            echo "| その親 | $parents |"
            if [ "$EVENT" = pull_request ]; then
              echo "| PRのhead | $HEAD_SHA |"
              echo "| PRのbase | $BASE_SHA |"
            fi
            echo "| checks（3 OS） | $CHECKS |"
            echo "| checks（Windowsの一般のユーザー） | $WINDOWS_STANDARD_USER |"
            echo "| browser（3 OS） | $BROWSER |"
            echo "| review tools（3 OS） | $REVIEW_TOOLS |"
            echo "| review plan | $REVIEW_PLAN |"
            echo
            if [ ${#problems[@]} -eq 0 ]; then
              echo '判定: 成功。CIの合格は、独立した内容レビューと所有者の判断の代わりにならない。'
            else
              echo '判定: 失敗。'
              printf -- '- %s\n' "${problems[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#problems[@]} -gt 0 ]; then
            printf '::error::%s\n' "${problems[@]}"
            exit 1
          fi
          echo 'すべてのジョブが成功した。'
